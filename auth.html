<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyTube - Login</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <div class="auth-container">
        <a href="index.html" class="logo">▶ MyTube</a>

        <div class="auth-box">
            <div class="auth-tabs">
                <button id="loginTab" class="auth-tab active-tab">Login</button>
                <button id="registerTab" class="auth-tab">Register</button>
            </div>

            <form id="loginForm" class="auth-form">
                <input type="email" id="loginEmail" placeholder="Email" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <p id="loginError" class="auth-error"></p>
                <button type="submit">Login</button>
            </form>

            <form id="registerForm" class="auth-form" style="display:none;">
                <input type="text" id="registerUsername" placeholder="Username" required>
                <input type="email" id="registerEmail" placeholder="Email" required>
                <input type="password" id="registerPassword" placeholder="Password (min 8 characters)" required>
                <p id="registerError" class="auth-error"></p>
                <button type="submit">Register</button>
            </form>
        </div>
    </div>
<script src="js/config.js"></script>
<script src="js/shared.js"></script>

    <script src="js/auth.js"></script>
</body>
</html>
